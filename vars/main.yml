# =====================================================
# Derived runtime values (DO NOT override directly)
# =====================================================

# Final runtime scheme used everywhere
# Derived runtime values
minio_scheme: "{{ 'https' if minio_tls_enabled | bool else 'http' }}"

# ADMIN endpoint (mc always talks locally)
minio_admin_endpoint: "{{ minio_scheme }}://127.0.0.1:{{ minio_api_port }}"


# Final endpoint identity used by clients
minio_server_fqdn: >-
  {{
    (minio_dns_enabled | bool)
    | ternary(
        (minio_ha_enabled | bool)
        | ternary(minio_lb_dns_name, minio_dns_name),
        ansible_default_ipv4.address
      )
  }}

# Final volume argument passed to MinIO ExecStart
minio_volumes: >-
  {{
    (minio_ha_enabled | bool)
    | ternary(minio_ha_endpoints | join(' '),
              minio_data_dirs | join(' '))
  }}

