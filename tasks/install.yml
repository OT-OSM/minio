---
# -------------------------------------------------------------------
# Create MinIO system group
# -------------------------------------------------------------------
- name: Create MinIO group
  ansible.builtin.group:
    name: "{{ minio_group }}"
    system: true
    state: present

# -------------------------------------------------------------------
# Create MinIO system user
# -------------------------------------------------------------------
- name: Create MinIO user
  ansible.builtin.user:
    name: "{{ minio_user }}"
    group: "{{ minio_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

# -------------------------------------------------------------------
# Download MinIO binary (idempotent & version-pinned)
# -------------------------------------------------------------------
- name: Download MinIO binary
  ansible.builtin.get_url:
    url: "{{ minio_binary_url }}"
    dest: "{{ minio_binary_path }}"
    mode: "0755"
    owner: root
    group: root
    force: false

# -------------------------------------------------------------------
# Defensive: ensure binary permissions (drift protection)
# -------------------------------------------------------------------
- name: Ensure MinIO binary ownership and permissions
  ansible.builtin.file:
    path: "{{ minio_binary_path }}"
    owner: root
    group: root
    mode: "0755"

# -------------------------------------------------------------------
# Create MinIO data directories
# ONLY if role is allowed to manage base path
# (Prevents accidental data creation on root FS)
# -------------------------------------------------------------------
- name: Ensure MinIO data directories exist with correct ownership
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ minio_user }}"
    group: "{{ minio_group }}"
    mode: "0750"
  loop: "{{ minio_data_dirs }}"

# -------------------------------------------------------------------
# Ensure MinIO configuration directory exists
# -------------------------------------------------------------------
- name: Create MinIO configuration directory
  ansible.builtin.file:
    path: "{{ minio_config_dir }}"
    state: directory
    owner: "{{ minio_user }}"
    group: "{{ minio_group }}"
    mode: "0750"
