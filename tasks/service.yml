---
# -------------------------------------------------------------------
# Install MinIO systemd service
# -------------------------------------------------------------------
- name: Install MinIO systemd service file
  ansible.builtin.template:
    src: minio.service.j2
    dest: /etc/systemd/system/{{ minio_service_name }}.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart minio

# -------------------------------------------------------------------
# Enable and start MinIO service
# -------------------------------------------------------------------
- name: Enable and start MinIO service
  ansible.builtin.systemd:
    name: "{{ minio_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
